# CI mínimo (Sprint A5, revisão de engenharia 2026-07-05 §4):
# ruff + suíte completa a cada push/PR. A suíte roda 100% offline
# (Ollama/Chroma/rede são mockados nos testes) com Qt headless.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
      # Diagnóstico do crash nativo flaky: em caso de SIGABRT, despeja o stack
      # de TODAS as threads (o log padrão só mostra a thread corrente).
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependências de sistema do Qt (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libnss3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxss1 \
            libasound2t64 libdbus-1-3 libdrm2 libgbm1 libxcb-cursor0 \
            libportaudio2

      - name: Instala dependências (torch CPU no CI; GPU só na máquina local)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check src tests

      # Suíte em 3 shards (processos separados) com retry DUPLO por shard.
      # A suíte tem um crash nativo flaky PRÉ-EXISTENTE sob carga (Qt/Chroma/
      # torch no teardown; documentado desde 2026-06-28, "exit 9 — reexecutar"):
      # no CI Linux vira SIGABRT (exit 134) em posição NÃO-determinística
      # (cada teste passa isolado, com -v e em fatia 3x — diagnóstico no PR #14).
      # Endurecimento 2026-07-17: o antigo shard 2 (p–z) abortou inclusive no
      # retry em 3 PRs (#22/#26/#29 — o rerun do job sempre passou), então ele
      # foi dividido (p–s / t–z, menos acúmulo nativo por processo) e o retry
      # virou duplo. Uma falha REAL de teste é determinística e falha em TODAS
      # as execuções — o retry não mascara bug de lógica, só o crash flaky.
      - name: Pytest (shard 1 — test_a..test_o)
        run: pytest tests/test_[a-o]*.py -q || pytest tests/test_[a-o]*.py -q || pytest tests/test_[a-o]*.py -q

      - name: Pytest (shard 2 — test_p..test_s)
        run: pytest tests/test_[p-s]*.py -q || pytest tests/test_[p-s]*.py -q || pytest tests/test_[p-s]*.py -q

      - name: Pytest (shard 3 — test_t..test_z)
        run: pytest tests/test_[t-z]*.py -q || pytest tests/test_[t-z]*.py -q || pytest tests/test_[t-z]*.py -q
