# CI mÃ­nimo (Sprint A5, revisÃ£o de engenharia 2026-07-05 Â§4):
# ruff + suÃ­te completa a cada push/PR. A suÃ­te roda 100% offline
# (Ollama/Chroma/rede sÃ£o mockados nos testes) com Qt headless.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: DependÃªncias de sistema do Qt (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libnss3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxss1 \
            libasound2t64 libdbus-1-3 libdrm2 libgbm1 libxcb-cursor0 \
            libportaudio2

      - name: Instala dependÃªncias (torch CPU no CI; GPU sÃ³ na mÃ¡quina local)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest tests/ -v
