# CI mínimo (Sprint A5, revisão de engenharia 2026-07-05 §4):
# ruff + suíte completa a cada push/PR. A suíte roda 100% offline
# (Ollama/Chroma/rede são mockados nos testes) com Qt headless.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependências de sistema do Qt (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libnss3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxss1 \
            libasound2t64 libdbus-1-3 libdrm2 libgbm1 libxcb-cursor0 \
            libportaudio2

      - name: Instala dependências (torch CPU no CI; GPU só na máquina local)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check src tests

      # Suíte em 2 processos: os ~800 testes num único processo acumulam
      # estado nativo (Chroma/torch/spaCy/Qt) e abortavam (exit 134) numa
      # raça de teardown aos ~63% — cada teste passa isolado e com -v.
      # Sharding zera o estado nativo no meio; todos os testes continuam
      # rodando (diagnóstico completo: PR #14, 2026-07-16).
      - name: Pytest (shard 1 — test_a..test_o)
        run: pytest tests/test_[a-o]*.py -q

      - name: Pytest (shard 2 — test_p..test_z)
        run: pytest tests/test_[p-z]*.py -q
