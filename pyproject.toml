[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "biblioteca-pessoal"
version = "0.1.0"
description = "Gerenciador de biblioteca pessoal e leitor multi-formato"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jefferson"},
]

dependencies = [
    "PyQt6>=6.6.0",
    "PyMuPDF>=1.23.0",
    "EbookLib>=0.18",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
    "markdown>=3.5.0",
    "natsort>=8.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
biblioteca = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
